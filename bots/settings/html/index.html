<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE - public: Settings</title>
    <link rel="icon" type="image/png" href="/forge/img/forge-logo.png">
    <link rel="stylesheet" href="css/settings.css?v=20260806a">
    <link rel="stylesheet" href="/forge/css/toast.css?v=20260722b">
</head>
<body>

<header class="header">
    <!-- Zeile 1: Logo + Letztes Update -->
    <div class="header-content">
        <div class="header-col header-logo">
            <a href="/forge/" title="Zur Hauptseite">
                <img src="/forge/img/forge-logo.png" alt="FORGE Logo" class="logo-icon">
            </a>
            <h1>Settings</h1>
            <span class="premium-status-icon has-tooltip hidden" id="premiumStatusIcon"
                  data-tooltip-title="Premium" data-tooltip-content=""><img src="/forge/img/forge-logo.png" alt="Premium"></span>
        </div>
        <div class="header-right">
            <span class="last-update" id="lastUpdate">–</span>
            <button class="notif-bell" id="notifBell" title="Message Center">
                <span class="notif-envelope">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M22 6l-10 7L2 6"></path></svg>
                </span><span class="notif-badge hidden" id="notifBadge">0</span>
            </button>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="bot-tab-panel" id="botTabPanel" role="tabpanel"></div>
</main>

<!-- Footer (Inhalt wird via initFooter() in nav.js gesetzt) -->
<footer class="footer"></footer>

<div class="toast-container" id="toastContainer"></div>

<div class="forge-tooltip" id="forgeTooltip">
    <table>
        <thead><tr><th id="forgeTooltipTitle"></th></tr></thead>
        <tbody><tr><td id="forgeTooltipBody"></td></tr></tbody>
    </table>
</div>

<script type="module" src="js/settings.js?v=20260808b"></script>
</body>
</html>
