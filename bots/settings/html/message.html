<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="msg.page_title">FORGE - public: Message Center</title>
    <link rel="icon" type="image/png" href="/forge/img/forge-logo.png">
    <link rel="stylesheet" href="css/settings.css?v=20260731e">
    <link rel="stylesheet" href="/forge/css/toast.css?v=20260722b">
    <link rel="stylesheet" href="css/message.css?v=20260816a">
    <!-- Sprache + Katalog, erzeugt von lib/i18n.js. Synchron und vor allen Modulen,
         damit die Seite nicht erst deutsch rendert und dann umgeschrieben wird. -->
    <script src="/forge/i18n/active.js"></script>
</head>
<body>

<header class="header mc-header">
    <div class="header-content">
        <div class="header-col header-logo">
            <a href="/forge/" title="Zur Hauptseite" data-i18n-attr="title:liq.to_main">
                <img src="/forge/img/forge-logo.png" alt="FORGE Logo" class="logo-icon">
            </a>
            <h1><span data-i18n="msg.message">Message</span> <span class="title-word-monitor" data-i18n="msg.center">Center</span></h1>
        </div>
        <div class="header-right">
            <span class="last-update" id="lastUpdate">–</span>
            <button class="notif-bell" id="notifBell" title="Support-Nachrichten" data-i18n-attr="title:msg.support_messages">
                <span class="notif-envelope">&#9993;</span><span class="notif-badge hidden" id="notifBadge">0</span>
            </button>
        </div>
    </div>
    <!-- Zeile 2: Rubriken-Tabs. Gleiche Optik/Bedienung wie die Reiter im Health
         Monitor (html/health.php, Klassen .health-tabs-band/.htab) – hier bewusst
         mit eigenen Klassennamen, weil message.html html/css/health.css nicht
         einbindet. "Einstellungen" ist absichtlich KEIN Reiter: dort gibt es keine
         Nachrichtenliste, die Rubrik hängt seit 2026-08-16 als eigener Eintrag im
         Hamburger-Menü (siehe nav.js) und schaltet die Seite auf ein Vollbreite-Panel. -->
    <div class="mc-tabs-band">
        <div class="mc-tabs-inner" id="mcTabs" role="tablist">
            <button class="mctab active" data-tab="system" role="tab" aria-selected="true">
                <span data-i18n="nav.message.system">System</span><span class="mctab-count" id="mcTabCountSystem" hidden>0</span>
            </button>
            <button class="mctab" data-tab="support" role="tab" aria-selected="false">
                <span data-i18n="nav.message.support">Support</span><span class="mctab-count" id="mcTabCountSupport" hidden>0</span>
            </button>
            <button class="mctab" data-tab="premium" role="tab" aria-selected="false">
                <span data-i18n="nav.message.premium">Premium</span><span class="mctab-count" id="mcTabCountPremium" hidden>0</span>
            </button>
        </div>
    </div>
</header>

<main class="main-content mc-layout">

    <!-- Postfach (System/Support/Premium): Suchzeile über einer Zwei-Spalten-Ansicht
         – links die scrollbare Nachrichtenliste (lädt beim Herunterscrollen nach,
         keine Seitenzahlen mehr), rechts die Detailansicht. Ersetzt seit 2026-08-16
         die vorherigen Volltabellen mit Detail-Modal; Vorbild ist die Verlaufsliste
         unter "Health Monitor > Daten teilen" (.hshare-history-split). -->
    <div class="mc-mail" id="mcMail" hidden>
        <div class="mc-toolbar">
            <input type="search" class="mcs-search" id="mcSearchInput" placeholder="Suchen…" autocomplete="off" data-i18n-attr="placeholder:msg.search">
            <div class="mc-toolbar-right">
                <button class="msg-new-btn" id="msgNewBtn" hidden data-i18n="msg.new_message">Neue Nachricht</button>
                <button class="msg-icon-btn" id="mcMarkAllBtn"
                    title="Alle als gelesen markieren"
                    aria-label="Alle als gelesen markieren" data-i18n-attr="title:msg.mark_all_read,aria-label:msg.mark_all_read">&#10003;</button>
            </div>
        </div>
        <div class="mc-split">
            <div class="mc-list" id="mcList"></div>
            <div class="mc-pane" id="mcPane"></div>
        </div>
    </div>

    <!-- Einstellungen: Vollbreite, kein Split (keine Nachrichtenliste in dieser Rubrik). -->
    <div class="mc-settings-panel" id="mcSettingsPanel" hidden>
        <div class="mc-detail-body" id="mcDetailBody"></div>
    </div>

</main>

<footer class="footer"></footer>

<div class="toast-container" id="toastContainer"></div>

<script type="module" src="js/message.js?v=20260816f"></script>
</body>
</html>
